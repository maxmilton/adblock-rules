name: ci

on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test:ci --coverage-reporter=text --coverage-reporter=lcov
      - name: Report coverage
        if: ${{ github.repository_owner == 'maxmilton' }}
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        with:
          oidc: true
          files: coverage/lcov.info

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Brave
        env:
          # renovate: depName=brave/brave-browser
          BRAVE_VERSION: v1.97.57
          BRAVE_SHA256: d79919a82aa869cf5121b641afa79958730c4bdaf36a0c51ae0f9c32f9c16bb9
          BRAVE_KEYRING_VERSION: "1.20"
          BRAVE_KEYRING_SHA256: 9ea8725ad4241e4d30bc31b0d5213c7ce24b1dcd5247875b2de1bcba8c4e9b00
        run: |
          tool_dir="$RUNNER_TEMP/brave"
          version="${BRAVE_VERSION#v}"
          package="brave-browser_${version}_amd64.deb"
          keyring_package="brave-keyring_${BRAVE_KEYRING_VERSION}-1.deb"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/brave/brave-browser/releases/download/$BRAVE_VERSION/$package" \
            --output "$tool_dir/$package"
          printf '%s  %s\n' "$BRAVE_SHA256" "$tool_dir/$package" | sha256sum --check --strict
          curl --fail --silent --show-error --location --retry 3 \
            "https://brave-browser-apt-release.s3.brave.com/pool/main/b/brave-keyring/$keyring_package" \
            --output "$tool_dir/$keyring_package"
          printf '%s  %s\n' "$BRAVE_KEYRING_SHA256" "$tool_dir/$keyring_package" | sha256sum --check --strict
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "$tool_dir/$package" "$tool_dir/$keyring_package"
          test "$(dpkg-query --show --showformat='${Version}' brave-browser)" = "$version"
          test "$(dpkg-query --show --showformat='${Version}' brave-keyring)" = "$BRAVE_KEYRING_VERSION"
          brave-browser --version
        shell: bash
      - run: bun run test:e2e --reporter=github,html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
